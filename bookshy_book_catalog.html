<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOOKSHY - Book Catalog</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #172554, #312E81);
      font-family: Arial, sans-serif;
      min-height: 100vh;
      color: white;
    }
    .head {
      background: linear-gradient(90deg, #0F766E, #115E59);
      margin: 0;
      padding: 15px;
    }
    .search-area {
      text-align: center;
      padding: 20px 10px 0;
    }
    #search {
      width: min(90%, 450px);
      box-sizing: border-box;
      padding: 12px;
      border-radius: 8px;
      border: 0;
    }
    .container {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: center;
      gap: 5px;
    }
    .container-1 {
      width: 260px;
      min-height: 170px;
      box-sizing: border-box;
      background-color: #1E293B;
      border-radius: 10px;
      padding: 15px;
      margin: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      overflow-wrap: anywhere;
    }
    .container-2 {
      background: linear-gradient(135deg, #FBBF24, #D97706);
      color: #1E1B4B;
      border-radius: 50%;
      padding: 12px 25px;
      font-size: 40px;
      position: fixed;
      bottom: 25px;
      right: 25px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }
    .container-3 {
      width: 100%;
      height: 100%;
      background-color: #1E1B4B;
      position: fixed;
      inset: 0;
      opacity: 0.6;
      display: none;
    }
    .container-4 {
      width: 80%;
      max-width: 350px;
      min-width: 260px;
      box-sizing: border-box;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 10px;
      padding: 18px;
      display: none;
      background: linear-gradient(135deg, #164E63, #0F172A);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      z-index: 2;
    }
    .book-details1 { color: #FBBF24; margin: 0 0 8px; }
    .book-details2 { color: #F8FAFC; margin: 0 0 8px; }
    .book-details3 { color: #CBD5E1; line-height: 1.4; }
    .input1, .input2, .input3 {
      width: 100%;
      box-sizing: border-box;
      margin: 8px 0;
      padding: 10px;
      background: rgba(255,255,255,0.12);
      color: white;
      border: 1px solid #64748B;
      border-radius: 5px;
    }
    .input3 { min-height: 75px; resize: vertical; }
    input:focus, textarea:focus { outline: 2px solid #FBBF24; }
    button {
      border: 0;
      padding: 8px 12px;
      margin: 5px 3px 0 0;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn1 { background-color: #0F766E; color: white; }
    .btn2 { background-color: #D97706; color: white; }
    .btn3 { background-color: #0F766E; color: white; }
    nav { text-align: center; font-size: 18px; font-weight: bold; color: #FBBF24; }
    #bookCount { text-align: center; color: #FDE68A; }
    @media (max-width: 450px) {
      .container-1 { width: calc(100% - 40px); margin: 15px 20px; }
    }
  
    /* Responsive layout */
    @media (max-width: 768px) {
      .head { padding: 14px 12px; }
      .head h1 { font-size: clamp(24px, 5vw, 34px); }
      .container { padding: 0 8px 80px; box-sizing: border-box; }
      .container-1 { width: min(100% - 24px, 340px); margin: 12px; }
      .container-4 { width: calc(100% - 32px); max-width: 400px; }
    }
    @media (max-width: 450px) {
      .search-area { padding: 16px 12px 0; }
      #search { width: 100%; }
      nav { font-size: 15px; padding: 0 10px; }
      .container { gap: 0; padding-left: 4px; padding-right: 4px; }
      .container-1 { width: calc(100% - 16px); margin: 8px; }
      .container-2 { right: 16px; bottom: 16px; font-size: 32px; padding: 10px 21px; }
      .container-4 { width: calc(100% - 24px); min-width: 0; max-height: 85vh; overflow-y: auto; padding: 14px; }
      button { max-width: 100%; }
    }
</style>
</head>
<body>
  <h1 class="head">BOOKSHY</h1>

  <div class="search-area">
    <input type="text" id="search" placeholder="Search by book title or author..." oninput="searchBook()">
    <p id="bookCount">Books: 0</p>
  </div>

  <div class="container" id="bookContainer"></div>

  <div class="container-2" onclick="clk2()">+</div>
  <div class="container-3" onclick="clk3()"></div>

  <div class="container-4">
    <nav id="popupTitle">ADD BOOK</nav>
    <input type="text" class="input1" placeholder="Book Title">
    <input type="text" class="input2" placeholder="Book Author">
    <textarea class="input3" placeholder="Short Description..."></textarea>
    <br>
    <button class="btn2" onclick="saveBook()">SAVE</button>
    <button class="btn3" onclick="clk3()">CANCEL</button>
  </div>

  <script>
    var container = document.getElementById("bookContainer");
    var overlay = document.querySelector(".container-3");
    var popup = document.querySelector(".container-4");
    var inp1 = document.querySelector(".input1");
    var inp2 = document.querySelector(".input2");
    var inp3 = document.querySelector(".input3");
    var editId = null;
    var books = JSON.parse(localStorage.getItem("bookshyBooks")) || [
      {
        id: 1,
        title: "Rich Dad Poor Son",
        author: "Robert",
        description: "A sample book description."
      }
    ];

    function saveToStorage() {
      localStorage.setItem("bookshyBooks", JSON.stringify(books));
    }

    function showBooks() {
      container.innerHTML = "";
      var searchValue = document.getElementById("search").value.toLowerCase();

      for (var i = 0; i < books.length; i++) {
        var book = books[i];
        var matches = book.title.toLowerCase().includes(searchValue) ||
          book.author.toLowerCase().includes(searchValue);

        if (!matches) {
          continue;
        }

        var card = document.createElement("div");
        card.className = "container-1";

        var title = document.createElement("h3");
        title.className = "book-details1";
        title.textContent = book.title;

        var author = document.createElement("h5");
        author.className = "book-details2";
        author.textContent = book.author;

        var description = document.createElement("p");
        description.className = "book-details3";
        description.textContent = book.description;

        var editButton = document.createElement("button");
        editButton.className = "btn2";
        editButton.textContent = "Edit";
        editButton.onclick = (function(bookId) {
          return function() { editBook(bookId); };
        })(book.id);

        var deleteButton = document.createElement("button");
        deleteButton.className = "btn1";
        deleteButton.textContent = "Delete";
        deleteButton.onclick = (function(bookId) {
          return function() { delbook(bookId); };
        })(book.id);

        card.appendChild(title);
        card.appendChild(author);
        card.appendChild(description);
        card.appendChild(editButton);
        card.appendChild(deleteButton);
        container.appendChild(card);
      }

      document.getElementById("bookCount").textContent =
        "Books: " + books.length;
    }

    function clk2() {
      editId = null;
      document.getElementById("popupTitle").textContent = "ADD BOOK";
      inp1.value = "";
      inp2.value = "";
      inp3.value = "";
      popup.style.display = "block";
      overlay.style.display = "block";
    }

    function clk3() {
      popup.style.display = "none";
      overlay.style.display = "none";
    }

    function saveBook() {
      var title = inp1.value.trim();
      var author = inp2.value.trim();
      var description = inp3.value.trim();

      if (title === "" || author === "" || description === "") {
        alert("Please fill all fields.");
        return;
      }

      if (editId === null) {
        var newBook = {
          id: Date.now(),
          title: title,
          author: author,
          description: description
        };
        books.push(newBook);
      } else {
        for (var i = 0; i < books.length; i++) {
          if (books[i].id === editId) {
            books[i].title = title;
            books[i].author = author;
            books[i].description = description;
            break;
          }
        }
      }

      saveToStorage();
      showBooks();
      clk3();
    }

    function editBook(id) {
      for (var i = 0; i < books.length; i++) {
        if (books[i].id === id) {
          editId = id;
          inp1.value = books[i].title;
          inp2.value = books[i].author;
          inp3.value = books[i].description;
          document.getElementById("popupTitle").textContent = "EDIT BOOK";
          popup.style.display = "block";
          overlay.style.display = "block";
          return;
        }
      }
    }

    function delbook(id) {
      if (confirm("Do you want to delete this book?")) {
        books = books.filter(function(book) {
          return book.id !== id;
        });
        saveToStorage();
        showBooks();
      }
    }

    function searchBook() {
      showBooks();
    }

    saveToStorage();
    showBooks();
  </script>
</body>
</html>
